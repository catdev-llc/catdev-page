<svg xmlns="http://www.w3.org/2000/svg" class="archify-diagram" viewBox="0 0 1120 578" role="img" aria-label="cyb3r Architecture — Pi runtime, cyb3r harness, reasoning model, and pi-pen-kit tooling. (architecture diagram)">
        <style>
  .archify-diagram {
    --bg: #020617;
    --grid: #1e293b;
    --text: #ffffff;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --lane-fill: rgba(15, 23, 42, 0.22);
    --lane-stroke: #334155;
    --arrow: #64748b;
    --arrow-emphasis: #34d399;
    --mask: #0f172a;
    --frontend-fill: rgba(8, 51, 68, 0.4);
    --frontend-stroke: #22d3ee;
    --backend-fill: rgba(6, 78, 59, 0.4);
    --backend-stroke: #34d399;
    --database-fill: rgba(76, 29, 149, 0.4);
    --database-stroke: #a78bfa;
    --cloud-fill: rgba(120, 53, 15, 0.3);
    --cloud-stroke: #fbbf24;
    --security-fill: rgba(136, 19, 55, 0.4);
    --security-stroke: #fb7185;
    --messagebus-fill: rgba(251, 146, 60, 0.3);
    --messagebus-stroke: #fb923c;
    --external-fill: rgba(30, 41, 59, 0.5);
    --external-stroke: #94a3b8;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }
  .c-bg { fill: var(--bg); }
  .c-grid { stroke: var(--grid); fill: none; }
  .c-mask { fill: var(--mask); stroke: none; }
  .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
  .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
  .c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
  .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
  .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
  .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
  .c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
  .c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4, 4; }
  .c-region { fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8, 4; }
  .c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6, 6; }
  .t-primary { fill: var(--text); }
  .t-muted { fill: var(--text-muted); }
  .t-dim { fill: var(--text-dim); }
  .t-frontend { fill: var(--frontend-stroke); }
  .t-backend { fill: var(--backend-stroke); }
  .t-database { fill: var(--database-stroke); }
  .t-cloud { fill: var(--cloud-stroke); }
  .t-security { fill: var(--security-stroke); }
  .t-messagebus { fill: var(--messagebus-stroke); }
  .t-external { fill: var(--external-stroke); }
  .a-default { stroke: var(--arrow); fill: none; }
  .a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
  .a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5, 5; }
  .a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4, 4; }
  .m-default { fill: var(--arrow); }
  .m-emphasis { fill: var(--arrow-emphasis); }
  .m-security { fill: var(--security-stroke); }
  .m-dashed { fill: var(--database-stroke); }
</style>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
        <!-- Background Grid -->
        <rect width="100%" height="100%" class="c-bg"/>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect x="440" y="248" width="290" height="262" rx="12" class="c-region" stroke-width="1"/>
        <text x="448" y="266" class="t-cloud" font-size="9" font-weight="600">cyb3r harness — offensive AI operator runtime</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 300 282 L 377 282 Q 385 282 385 290 L 385 298 Q 385 306 393 306 L 470 306" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 700 306 L 767 306 Q 775 306 775 298 L 775 233 Q 775 225 783 225 L 850 225" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 700 462 L 767 462 Q 775 462 775 454 L 775 448 Q 775 440 783 440 L 850 440" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <rect x="90" y="222" width="210" height="120" rx="6" class="c-mask"/>
        <rect x="90" y="222" width="210" height="120" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="195" y="280" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Pi agent</text>
        <text x="195" y="296" class="t-muted" font-size="9" text-anchor="middle">packages · shell · sessions</text>
        <text x="195" y="334" class="t-backend" font-size="7" text-anchor="middle">runtime layer</text>

        <rect x="470" y="278" width="230" height="56" rx="6" class="c-mask"/>
        <rect x="470" y="278" width="230" height="56" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="585" y="310" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Plan / execute / adapt</text>

        <rect x="470" y="356" width="230" height="56" rx="6" class="c-mask"/>
        <rect x="470" y="356" width="230" height="56" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="585" y="388" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Operator policies</text>

        <rect x="470" y="434" width="230" height="56" rx="6" class="c-mask"/>
        <rect x="470" y="434" width="230" height="56" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="585" y="466" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Tool orchestration</text>

        <rect x="850" y="165" width="230" height="120" rx="6" class="c-mask"/>
        <rect x="850" y="165" width="230" height="120" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="965" y="223" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Reasoning model</text>
        <text x="965" y="239" class="t-muted" font-size="9" text-anchor="middle">branch ranking · pivots</text>
        <text x="965" y="277" class="t-external" font-size="7" text-anchor="middle">operator reasoning</text>

        <rect x="850" y="380" width="230" height="120" rx="6" class="c-mask"/>
        <rect x="850" y="380" width="230" height="120" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="965" y="438" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">pi-pen-kit</text>
        <text x="965" y="454" class="t-muted" font-size="9" text-anchor="middle">Sliver · Metasploit · shells</text>
        <text x="965" y="492" class="t-frontend" font-size="7" text-anchor="middle">tool layer</text>

        <!-- Connection labels -->

        <rect x="755.6" y="245.5" width="38.8" height="14" rx="3" class="c-mask"/>
        <text x="775" y="255.5" class="t-backend" font-size="8" text-anchor="middle">decide</text>
        <rect x="758" y="431" width="34" height="14" rx="3" class="c-mask"/>
        <text x="775" y="441" class="t-muted" font-size="8" text-anchor="middle">tools</text>

        <!-- Legend -->
        <text x="40" y="549" class="t-primary" font-size="9" font-weight="600">Legend</text>
        <rect x="40" y="554" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="60" y="562" class="t-muted" font-size="8">Backend</text>
        <rect x="133" y="554" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="153" y="562" class="t-muted" font-size="8">Security</text>
        <rect x="231" y="554" width="14" height="9" rx="2" class="c-external" stroke-width="1"/>
        <text x="251" y="562" class="t-muted" font-size="8">External</text>
        <rect x="329" y="554" width="14" height="9" rx="2" class="c-frontend" stroke-width="1"/>
        <text x="349" y="562" class="t-muted" font-size="8">Frontend</text>
      </svg>
