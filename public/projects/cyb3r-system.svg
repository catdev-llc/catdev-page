<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="28" fill="#080b12"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171d2c"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="arrow-cyb3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff3154"/>
    </marker>
  </defs>

  <g opacity="0.2" stroke="#27324a">
    <path d="M80 110H1120M80 190H1120M80 270H1120M80 350H1120M80 430H1120M80 510H1120M80 590H1120"/>
    <path d="M120 70V630M240 70V630M360 70V630M480 70V630M600 70V630M720 70V630M840 70V630M960 70V630M1080 70V630"/>
  </g>

  <text x="70" y="78" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">cyb3r Architecture</text>
  <text x="70" y="112" fill="#9ca3af" font-family="Inter, Arial, sans-serif" font-size="17">Pi runtime, cyb3r harness, reasoning model, and pi-pen-kit tooling.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="90" y="222" width="220" height="145" rx="18" fill="url(#panel)" stroke="#27324a"/>
    <text x="123" y="272" fill="#f8fafc" font-size="25" font-weight="800">Pi agent</text>
    <text x="123" y="302" fill="#22d3ee" font-size="15" font-weight="700">runtime layer</text>
    <text x="123" y="332" fill="#9ca3af" font-size="15">packages, shell,</text>
    <text x="123" y="354" fill="#9ca3af" font-size="15">sessions, workflow</text>

    <rect x="405" y="150" width="330" height="360" rx="22" fill="#101827" stroke="#ff3154" stroke-opacity="0.55"/>
    <text x="450" y="204" fill="#ff3154" font-size="28" font-weight="800">cyb3r harness</text>
    <text x="450" y="235" fill="#9ca3af" font-size="15">offensive AI operator runtime</text>

    <rect x="450" y="278" width="240" height="58" rx="12" fill="#171d2c" stroke="#27324a"/>
    <text x="474" y="313" fill="#f8fafc" font-size="17" font-weight="700">Plan / execute / adapt</text>
    <rect x="450" y="356" width="240" height="58" rx="12" fill="#171d2c" stroke="#27324a"/>
    <text x="474" y="391" fill="#f8fafc" font-size="17" font-weight="700">Operator policies</text>
    <rect x="450" y="434" width="240" height="58" rx="12" fill="#171d2c" stroke="#27324a"/>
    <text x="474" y="469" fill="#f8fafc" font-size="17" font-weight="700">Tool orchestration</text>

    <rect x="845" y="150" width="250" height="150" rx="18" fill="url(#panel)" stroke="#27324a"/>
    <text x="880" y="203" fill="#f8fafc" font-size="25" font-weight="800">Reasoning model</text>
    <text x="880" y="233" fill="#ff3154" font-size="15" font-weight="700">operator reasoning</text>
    <text x="880" y="263" fill="#9ca3af" font-size="15">branch ranking,</text>
    <text x="880" y="285" fill="#9ca3af" font-size="15">pivot decisions</text>

    <rect x="845" y="360" width="250" height="155" rx="18" fill="url(#panel)" stroke="#27324a"/>
    <text x="880" y="412" fill="#f8fafc" font-size="25" font-weight="800">pi-pen-kit</text>
    <text x="880" y="442" fill="#22d3ee" font-size="15" font-weight="700">tool layer</text>
    <text x="880" y="472" fill="#9ca3af" font-size="15">Sliver, Metasploit,</text>
    <text x="880" y="494" fill="#9ca3af" font-size="15">interactive shells</text>
  </g>

  <g stroke="#ff3154" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M310 294H405"/>
    <path d="M735 225H845"/>
    <path d="M735 438H845"/>
  </g>
  <g stroke="#ff3154" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 294H405" marker-start="url(#arrow-cyb3r)" marker-end="url(#arrow-cyb3r)"/>
    <path d="M735 225H845" marker-start="url(#arrow-cyb3r)" marker-end="url(#arrow-cyb3r)"/>
    <path d="M735 438H845" marker-start="url(#arrow-cyb3r)" marker-end="url(#arrow-cyb3r)"/>
  </g>

  <rect x="200" y="585" width="800" height="58" rx="14" fill="#101827" stroke="#27324a"/>
  <text x="232" y="614" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Goal: make penetration-testing workflows agent-native</text>
  <text x="232" y="636" fill="#9ca3af" font-family="Inter, Arial, sans-serif" font-size="15">without losing operator discipline, evidence tracking, or interactive control.</text>
</svg>
