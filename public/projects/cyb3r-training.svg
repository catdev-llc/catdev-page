<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="420" rx="28" fill="#080b12"/>
  <defs>
    <marker id="arrow-train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff3154"/>
    </marker>
  </defs>

  <text x="70" y="78" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Training Direction</text>
  <text x="70" y="112" fill="#9ca3af" font-family="Inter, Arial, sans-serif" font-size="17">First target: penetration-testing reasoning. Next target: broader security knowledge.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="82" y="190" width="210" height="150" rx="16" fill="#111827" stroke="#27324a"/>
    <text x="112" y="236" fill="#ff3154" font-size="15" font-weight="800">DATA</text>
    <text x="112" y="274" fill="#f8fafc" font-size="22" font-weight="800">Security corpus</text>
    <text x="112" y="304" fill="#9ca3af" font-size="15">~1.6B cybersec</text>
    <text x="112" y="326" fill="#9ca3af" font-size="15">training rows</text>

    <rect x="360" y="190" width="210" height="150" rx="16" fill="#111827" stroke="#27324a"/>
    <text x="390" y="236" fill="#ff3154" font-size="15" font-weight="800">EPOCH 01-03</text>
    <text x="390" y="274" fill="#f8fafc" font-size="22" font-weight="800">Training pass</text>
    <text x="390" y="304" fill="#9ca3af" font-size="15">reasoning-first</text>
    <text x="390" y="326" fill="#9ca3af" font-size="15">fine-tuning</text>

    <rect x="638" y="190" width="210" height="150" rx="16" fill="#111827" stroke="#27324a"/>
    <text x="668" y="236" fill="#ff3154" font-size="15" font-weight="800">BEHAVIOR</text>
    <text x="668" y="274" fill="#f8fafc" font-size="22" font-weight="800">Reasoning</text>
    <text x="668" y="304" fill="#9ca3af" font-size="15">branch ranking,</text>
    <text x="668" y="326" fill="#9ca3af" font-size="15">replans, restraint</text>

    <rect x="916" y="190" width="210" height="150" rx="16" fill="#111827" stroke="#27324a"/>
    <text x="946" y="236" fill="#ff3154" font-size="15" font-weight="800">NEXT</text>
    <text x="946" y="274" fill="#f8fafc" font-size="22" font-weight="800">Knowledge</text>
    <text x="946" y="304" fill="#9ca3af" font-size="15">tools, techniques,</text>
    <text x="946" y="326" fill="#9ca3af" font-size="15">procedures</text>
  </g>

  <g stroke="#ff3154" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M292 265H360"/>
    <path d="M570 265H638"/>
    <path d="M848 265H916"/>
  </g>
  <g stroke="#ff3154" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 265H360" marker-end="url(#arrow-train)"/>
    <path d="M570 265H638" marker-end="url(#arrow-train)"/>
    <path d="M848 265H916" marker-end="url(#arrow-train)"/>
  </g>

</svg>
