<svg xmlns="http://www.w3.org/2000/svg" class="archify-diagram" viewBox="0 0 1160 788" role="img" aria-label="Simulator Demo / Testbed — Repeatable ALM/OTDR behavior for demos, integration tests, and fault scenarios. (architecture diagram)">
        <style>
  .archify-diagram {
    --bg: #020617;
    --grid: #1e293b;
    --text: #ffffff;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --lane-fill: rgba(15, 23, 42, 0.22);
    --lane-stroke: #334155;
    --arrow: #64748b;
    --arrow-emphasis: #34d399;
    --mask: #0f172a;
    --frontend-fill: rgba(8, 51, 68, 0.4);
    --frontend-stroke: #22d3ee;
    --backend-fill: rgba(6, 78, 59, 0.4);
    --backend-stroke: #34d399;
    --database-fill: rgba(76, 29, 149, 0.4);
    --database-stroke: #a78bfa;
    --cloud-fill: rgba(120, 53, 15, 0.3);
    --cloud-stroke: #fbbf24;
    --security-fill: rgba(136, 19, 55, 0.4);
    --security-stroke: #fb7185;
    --messagebus-fill: rgba(251, 146, 60, 0.3);
    --messagebus-stroke: #fb923c;
    --external-fill: rgba(30, 41, 59, 0.5);
    --external-stroke: #94a3b8;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }
  .c-bg { fill: var(--bg); }
  .c-grid { stroke: var(--grid); fill: none; }
  .c-mask { fill: var(--mask); stroke: none; }
  .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
  .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
  .c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
  .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
  .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
  .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
  .c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
  .c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4, 4; }
  .c-region { fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8, 4; }
  .c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6, 6; }
  .t-primary { fill: var(--text); }
  .t-muted { fill: var(--text-muted); }
  .t-dim { fill: var(--text-dim); }
  .t-frontend { fill: var(--frontend-stroke); }
  .t-backend { fill: var(--backend-stroke); }
  .t-database { fill: var(--database-stroke); }
  .t-cloud { fill: var(--cloud-stroke); }
  .t-security { fill: var(--security-stroke); }
  .t-messagebus { fill: var(--messagebus-stroke); }
  .t-external { fill: var(--external-stroke); }
  .a-default { stroke: var(--arrow); fill: none; }
  .a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
  .a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5, 5; }
  .a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4, 4; }
  .m-default { fill: var(--arrow); }
  .m-emphasis { fill: var(--arrow-emphasis); }
  .m-security { fill: var(--security-stroke); }
  .m-dashed { fill: var(--database-stroke); }
</style>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
        <!-- Background Grid -->
        <rect width="100%" height="100%" class="c-bg"/>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 600 250 L 600 330" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 320 395 L 450 395" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path d="M 750 395 L 880 395" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path d="M 530 640 L 530 556 Q 530 548 538 548 L 592 548 Q 600 548 600 540 L 600 460" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path d="M 600 460 L 600 540 Q 600 548 608 548 L 662 548 Q 670 548 670 556 L 670 640" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <rect x="450" y="150" width="300" height="100" rx="6" class="c-mask"/>
        <rect x="450" y="150" width="300" height="100" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="600" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">hikari-connect</text>
        <text x="600" y="214" class="t-muted" font-size="9" text-anchor="middle">MCP tool calls</text>

        <rect x="450" y="330" width="300" height="130" rx="6" class="c-mask"/>
        <rect x="450" y="330" width="300" height="130" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="600" y="393" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Simulator engine</text>
        <text x="600" y="409" class="t-muted" font-size="9" text-anchor="middle">ports + monitoring</text>
        <text x="600" y="452" class="t-backend" font-size="7" text-anchor="middle">OTDR generation</text>

        <rect x="80" y="340" width="240" height="110" rx="6" class="c-mask"/>
        <rect x="80" y="340" width="240" height="110" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="200" y="393" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">ALM-style UI</text>
        <text x="200" y="409" class="t-muted" font-size="9" text-anchor="middle">operator screens</text>

        <rect x="880" y="340" width="240" height="110" rx="6" class="c-mask"/>
        <rect x="880" y="340" width="240" height="110" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="1000" y="393" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">State database</text>
        <text x="1000" y="409" class="t-muted" font-size="9" text-anchor="middle">ports + history</text>

        <rect x="470" y="640" width="120" height="80" rx="6" class="c-mask"/>
        <rect x="470" y="640" width="120" height="80" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="530" y="678" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Fault scenarios</text>
        <text x="530" y="694" class="t-muted" font-size="9" text-anchor="middle">breaks + bends</text>

        <rect x="610" y="640" width="120" height="80" rx="6" class="c-mask"/>
        <rect x="610" y="640" width="120" height="80" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="670" y="678" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Trace output</text>
        <text x="670" y="694" class="t-muted" font-size="9" text-anchor="middle">plots + reports</text>

        <!-- Connection labels -->



        <rect x="563.6" y="528" width="38.8" height="14" rx="3" class="c-mask"/>
        <text x="583" y="538" class="t-muted" font-size="8" text-anchor="middle">inject</text>
        <rect x="597.6" y="528" width="38.8" height="14" rx="3" class="c-mask"/>
        <text x="617" y="538" class="t-muted" font-size="8" text-anchor="middle">render</text>

        <!-- Legend -->
        <text x="40" y="759" class="t-primary" font-size="9" font-weight="600">Legend</text>
        <rect x="40" y="764" width="14" height="9" rx="2" class="c-frontend" stroke-width="1"/>
        <text x="60" y="772" class="t-muted" font-size="8">Frontend</text>
        <rect x="138" y="764" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="158" y="772" class="t-muted" font-size="8">Backend</text>
        <rect x="231" y="764" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="251" y="772" class="t-muted" font-size="8">Database</text>
        <rect x="329" y="764" width="14" height="9" rx="2" class="c-external" stroke-width="1"/>
        <text x="349" y="772" class="t-muted" font-size="8">External</text>
      </svg>
