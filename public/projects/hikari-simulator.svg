  <text x="70" y="110" fill="#9ab0d3" font-family="Inter, Arial, sans-serif" font-size="17">Repeatable ALM/OTDR behavior for demos, integration tests, and fault scenarios.</text>

  <g font-family="Inter, Arial, sans-serif">
