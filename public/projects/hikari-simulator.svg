    <text x="500" y="416" fill="#9ab0d3" font-size="16">ports + monitoring</text>
    <text x="500" y="444" fill="#9ab0d3" font-size="16">OTDR generation</text>

    <rect x="80" y="340" width="240" height="126" rx="18" fill="#111d35" stroke="#2b3d61"/>
