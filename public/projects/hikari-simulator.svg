<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="680" rx="28" fill="#07101f"/>
  <defs>
    <linearGradient id="simAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffc57a"/>
