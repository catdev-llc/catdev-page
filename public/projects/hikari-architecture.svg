    <text x="112" y="582" fill="#9ab0d3" font-size="16">SNMP / ALM</text>

    <rect x="390" y="150" width="320" height="500" rx="24" fill="#0c172c" stroke="#2ce8c0" stroke-opacity="0.65"/>
