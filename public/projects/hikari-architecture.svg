    <text x="468" y="407" fill="#e7f0ff" font-size="18" font-weight="700">Group router</text>
    <rect x="436" y="448" width="228" height="58" rx="12" fill="#14233d" stroke="#2b3d61"/>
    <text x="468" y="485" fill="#e7f0ff" font-size="18" font-weight="700">Queue</text>
    <rect x="436" y="526" width="228" height="58" rx="12" fill="#14233d" stroke="#2b3d61"/>
    <text x="468" y="563" fill="#e7f0ff" font-size="18" font-weight="700">Agent runner</text>

    <rect x="800" y="170" width="230" height="146" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="832" y="226" fill="#e7f0ff" font-size="24" font-weight="800">Agent runtime</text>
    <text x="832" y="258" fill="#9ab0d3" font-size="16">scoped sessions</text>

    <rect x="1090" y="170" width="230" height="146" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="1122" y="226" fill="#e7f0ff" font-size="24" font-weight="800">LLM provider</text>
    <text x="1122" y="258" fill="#9ab0d3" font-size="16">reason + synthesize</text>

    <rect x="800" y="500" width="230" height="146" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="832" y="556" fill="#e7f0ff" font-size="24" font-weight="800">hikari-connect</text>
    <text x="832" y="588" fill="#9ab0d3" font-size="16">MCP tool bridge</text>

    <rect x="1090" y="500" width="230" height="146" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="1122" y="556" fill="#e7f0ff" font-size="24" font-weight="800">ALM / OTDR</text>
    <text x="1122" y="588" fill="#9ab0d3" font-size="16">device access</text>

    <rect x="800" y="700" width="520" height="62" rx="16" fill="#121a2d" stroke="#ffc57a" stroke-opacity="0.75" stroke-dasharray="8 8"/>
