    <text x="112" y="274" fill="#9ab0d3" font-size="16">Slack / Telegram</text>
    <text x="112" y="298" fill="#9ab0d3" font-size="16">chat + control</text>

    <rect x="80" y="498" width="240" height="118" rx="18" fill="#111d35" stroke="#2b3d61"/>
