<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="820" rx="30" fill="#07101f"/>
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2ce8c0"/>
      <stop offset="1" stop-color="#6ee9ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffc57a"/>
      <stop offset="1" stop-color="#ff8e6e"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ce8c0"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc57a"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.13" stroke="#2b3d61">
    <path d="M80 140H1320M80 260H1320M80 380H1320M80 500H1320M80 620H1320M80 740H1320"/>
    <path d="M160 90V760M320 90V760M480 90V760M640 90V760M800 90V760M960 90V760M1120 90V760M1280 90V760"/>
  </g>

  <text x="70" y="78" fill="#e7f0ff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Hikari System</text>
  <text x="70" y="114" fill="#9ab0d3" font-family="Inter, Arial, sans-serif" font-size="18">Core handles events, chat-based control, device tools, state, and model-driven analysis.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="190" width="240" height="118" rx="18" fill="#111d35" stroke="#2b3d61"/>
