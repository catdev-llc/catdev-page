    <text x="354" y="378" fill="#e7f0ff" font-size="24" font-weight="800">hikari-core</text>
    <text x="354" y="407" fill="#9ab0d3" font-size="16">store + route</text>

    <rect x="590" y="290" width="210" height="134" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="624" y="340" fill="#2ce8c0" font-size="15" font-weight="800">03 AGENT</text>
    <text x="624" y="378" fill="#e7f0ff" font-size="24" font-weight="800">Runtime</text>
    <text x="624" y="407" fill="#9ab0d3" font-size="16">reason + plan</text>

    <rect x="860" y="290" width="220" height="134" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="894" y="340" fill="#2ce8c0" font-size="15" font-weight="800">04 TOOLS</text>
    <text x="894" y="378" fill="#e7f0ff" font-size="24" font-weight="800">Connect</text>
    <text x="894" y="407" fill="#9ab0d3" font-size="16">OTDR evidence</text>

    <rect x="1140" y="290" width="200" height="134" rx="18" fill="#111d35" stroke="#2b3d61"/>
    <text x="1174" y="340" fill="#2ce8c0" font-size="15" font-weight="800">05 OUTPUT</text>
    <text x="1174" y="378" fill="#e7f0ff" font-size="24" font-weight="800">Report</text>
    <text x="1174" y="407" fill="#9ab0d3" font-size="16">dispatch-ready</text>

    <rect x="590" y="128" width="210" height="96" rx="16" fill="#0d1a31" stroke="#2b3d61"/>
