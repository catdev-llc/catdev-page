<svg xmlns="http://www.w3.org/2000/svg" class="archify-diagram" viewBox="0 0 1080 720" role="img" aria-label="Alarm To Incident Output — A device alarm becomes a trace-backed incident analysis. (data-flow diagram)">
        <style>
  .archify-diagram {
    --bg: #020617;
    --grid: #1e293b;
    --text: #ffffff;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --lane-fill: rgba(15, 23, 42, 0.22);
    --lane-stroke: #334155;
    --arrow: #64748b;
    --arrow-emphasis: #34d399;
    --mask: #0f172a;
    --frontend-fill: rgba(8, 51, 68, 0.4);
    --frontend-stroke: #22d3ee;
    --backend-fill: rgba(6, 78, 59, 0.4);
    --backend-stroke: #34d399;
    --database-fill: rgba(76, 29, 149, 0.4);
    --database-stroke: #a78bfa;
    --cloud-fill: rgba(120, 53, 15, 0.3);
    --cloud-stroke: #fbbf24;
    --security-fill: rgba(136, 19, 55, 0.4);
    --security-stroke: #fb7185;
    --messagebus-fill: rgba(251, 146, 60, 0.3);
    --messagebus-stroke: #fb923c;
    --external-fill: rgba(30, 41, 59, 0.5);
    --external-stroke: #94a3b8;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }
  .c-bg { fill: var(--bg); }
  .c-grid { stroke: var(--grid); fill: none; }
  .c-mask { fill: var(--mask); stroke: none; }
  .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
  .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
  .c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
  .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
  .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
  .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
  .c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
  .c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4, 4; }
  .c-region { fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8, 4; }
  .c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6, 6; }
  .t-primary { fill: var(--text); }
  .t-muted { fill: var(--text-muted); }
  .t-dim { fill: var(--text-dim); }
  .t-frontend { fill: var(--frontend-stroke); }
  .t-backend { fill: var(--backend-stroke); }
  .t-database { fill: var(--database-stroke); }
  .t-cloud { fill: var(--cloud-stroke); }
  .t-security { fill: var(--security-stroke); }
  .t-messagebus { fill: var(--messagebus-stroke); }
  .t-external { fill: var(--external-stroke); }
  .a-default { stroke: var(--arrow); fill: none; }
  .a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
  .a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5, 5; }
  .a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4, 4; }
  .m-default { fill: var(--arrow); }
  .m-emphasis { fill: var(--arrow-emphasis); }
  .m-security { fill: var(--security-stroke); }
  .m-dashed { fill: var(--database-stroke); }
</style>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
        <!-- Background Grid -->
        <rect width="100%" height="100%" class="c-bg"/>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect x="16" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Event</text>

        <rect x="231" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / Core</text>

        <rect x="446" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / Agent</text>

        <rect x="661" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="745" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">04 / Tools</text>

        <rect x="876" y="46" width="168" height="600" rx="10" class="c-lane" stroke-width="1"/>
        <text x="960" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">05 / Output</text>

        <!-- Flow paths -->
        <path d="M 156 385 L 259 385" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 371 385 L 474 385" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 586 385 L 689 385" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 801 385 L 904 385" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 530 186 L 530 356" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 745 584 L 745 414" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <rect x="44" y="356" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="44" y="356" width="112" height="58" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="100" y="377" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Alarm</text>
        <text x="100" y="393" class="t-muted" font-size="7" text-anchor="middle">SNMP payload</text>

        <rect x="259" y="356" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="259" y="356" width="112" height="58" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="315" y="377" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">hikari-core</text>
        <text x="315" y="393" class="t-muted" font-size="7" text-anchor="middle">store + route</text>

        <rect x="474" y="356" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="474" y="356" width="112" height="58" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="530" y="377" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Runtime</text>
        <text x="530" y="393" class="t-muted" font-size="7" text-anchor="middle">reason + plan</text>

        <rect x="689" y="356" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="689" y="356" width="112" height="58" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="745" y="377" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Connect</text>
        <text x="745" y="393" class="t-muted" font-size="7" text-anchor="middle">OTDR evidence</text>

        <rect x="904" y="356" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="904" y="356" width="112" height="58" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="960" y="377" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Report</text>
        <text x="960" y="393" class="t-muted" font-size="7" text-anchor="middle">dispatch-ready</text>

        <rect x="474" y="128" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="474" y="128" width="112" height="58" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="530" y="149" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">LLM provider</text>
        <text x="530" y="165" class="t-muted" font-size="7" text-anchor="middle">reasoning layer</text>

        <rect x="689" y="584" width="112" height="58" rx="6" class="c-mask"/>
        <rect x="689" y="584" width="112" height="58" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="745" y="605" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">ALM / OTDR</text>
        <text x="745" y="621" class="t-muted" font-size="7" text-anchor="middle">device or simulator</text>

        <!-- Flow labels -->
        <rect x="189.25" y="364" width="36.5" height="16" rx="4" class="c-mask"/>
        <text x="207.5" y="375" class="t-backend" font-size="8" text-anchor="middle">event</text>
        <rect x="404.25" y="364" width="36.5" height="16" rx="4" class="c-mask"/>
        <text x="422.5" y="375" class="t-backend" font-size="8" text-anchor="middle">route</text>
        <rect x="619.25" y="364" width="36.5" height="16" rx="4" class="c-mask"/>
        <text x="637.5" y="375" class="t-backend" font-size="8" text-anchor="middle">query</text>
        <rect x="826.9" y="364" width="51.2" height="16" rx="4" class="c-mask"/>
        <text x="852.5" y="375" class="t-backend" font-size="8" text-anchor="middle">evidence</text>
        <rect x="501.95" y="261" width="56.1" height="16" rx="4" class="c-mask"/>
        <text x="530" y="272" class="t-backend" font-size="8" text-anchor="middle">reasoning</text>
        <rect x="716.95" y="489" width="56.1" height="16" rx="4" class="c-mask"/>
        <text x="745" y="500" class="t-backend" font-size="8" text-anchor="middle">telemetry</text>

        <!-- Legend -->
        <text x="214" y="664" class="t-primary" font-size="10" font-weight="600">Legend</text>
        <path d="M 214 684 L 248 684" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <text x="257" y="687" class="t-muted" font-size="8">primary data</text>
        <path d="M 340 684 L 374 684" class="a-security" stroke-width="1.4" marker-end="url(#arrowhead-security)"/>
        <text x="383" y="687" class="t-muted" font-size="8">policy / PII</text>
        <path d="M 480 684 L 514 684" class="a-dashed" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
        <text x="523" y="687" class="t-muted" font-size="8">async batch</text>
        <rect x="625" y="676" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="646" y="684" class="t-muted" font-size="8">data store</text>
      </svg>
