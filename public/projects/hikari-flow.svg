    <path d="M530 357H590" marker-end="url(#arrow-flow)"/>
    <path d="M800 357H860" marker-start="url(#arrow-flow)" marker-end="url(#arrow-flow)"/>
    <path d="M1080 357H1140" marker-end="url(#arrow-flow)"/>
    <path d="M695 224V290" marker-start="url(#arrow-flow)" marker-end="url(#arrow-flow)"/>
    <path d="M970 424V500" marker-start="url(#arrow-flow)" marker-end="url(#arrow-flow)"/>
