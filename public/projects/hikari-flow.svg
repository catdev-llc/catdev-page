    <text x="624" y="198" fill="#9ab0d3" font-size="15">reasoning layer</text>

    <rect x="860" y="500" width="220" height="96" rx="16" fill="#0d1a31" stroke="#2b3d61"/>
    <text x="894" y="542" fill="#e7f0ff" font-size="22" font-weight="800">ALM / OTDR</text>
    <text x="894" y="570" fill="#9ab0d3" font-size="15">device or simulator</text>
