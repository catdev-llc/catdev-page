    <path d="M160 100V650M320 100V650M480 100V650M640 100V650M800 100V650M960 100V650M1120 100V650M1280 100V650"/>
  </g>

  <text x="70" y="78" fill="#e7f0ff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Alarm To Incident Output</text>
  <text x="70" y="114" fill="#9ab0d3" font-family="Inter, Arial, sans-serif" font-size="18">A device alarm becomes a trace-backed incident analysis.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="290" width="190" height="134" rx="18" fill="#111d35" stroke="#2b3d61"/>
