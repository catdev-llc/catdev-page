<svg width="1400" height="720" viewBox="0 0 1400 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="720" rx="30" fill="#0b0f16"/>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <g opacity="0.12" stroke="#334155">
    <path d="M80 130H1320M80 250H1320M80 370H1320M80 490H1320M80 610H1320"/>
    <path d="M180 80V650M340 80V650M500 80V650M660 80V650M820 80V650M980 80V650M1140 80V650M1300 80V650"/>
  </g>

  <text x="70" y="78" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Model Roles In AXIOM</text>
  <text x="70" y="114" fill="#a7b0c2" font-family="Inter, Arial, sans-serif" font-size="18">LLMs are selected by role; retrieval and document intelligence run through dedicated local models.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="150" width="285" height="455" rx="22" fill="#111827" stroke="#f59e0b" stroke-opacity="0.7"/>
    <text x="120" y="206" fill="#fbbf24" font-size="28" font-weight="800">LLM slots</text>
    <text x="120" y="238" fill="#a7b0c2" font-size="16">configured per user</text>

    <rect x="120" y="300" width="205" height="54" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="145" y="334" fill="#f8fafc" font-size="17" font-weight="700">Fast</text>
    <rect x="120" y="375" width="205" height="54" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="145" y="409" fill="#f8fafc" font-size="17" font-weight="700">Mid</text>
    <rect x="120" y="450" width="205" height="54" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="145" y="484" fill="#f8fafc" font-size="17" font-weight="700">Intelligent</text>
    <rect x="120" y="525" width="205" height="54" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="145" y="559" fill="#f8fafc" font-size="17" font-weight="700">Verifier</text>

    <rect x="455" y="170" width="310" height="380" rx="22" fill="#151b26" stroke="#334155"/>
    <text x="495" y="226" fill="#f8fafc" font-size="28" font-weight="800">Agent work</text>
    <text x="495" y="258" fill="#a7b0c2" font-size="16">different jobs need different models</text>
    <text x="495" y="320" fill="#a7b0c2" font-size="16">Planning, note assignment,</text>
    <text x="495" y="344" fill="#a7b0c2" font-size="16">query strategy</text>
    <text x="495" y="400" fill="#a7b0c2" font-size="16">Research, writing, chat,</text>
    <text x="495" y="424" fill="#a7b0c2" font-size="16">source synthesis</text>
    <text x="495" y="480" fill="#a7b0c2" font-size="16">Reflection, query prep,</text>
    <text x="495" y="504" fill="#a7b0c2" font-size="16">quality checks</text>

    <rect x="865" y="110" width="455" height="210" rx="22" fill="#111827" stroke="#f59e0b" stroke-opacity="0.7"/>
    <text x="905" y="166" fill="#fbbf24" font-size="28" font-weight="800">Provider layer</text>
    <text x="905" y="200" fill="#a7b0c2" font-size="16">OpenRouter, OpenAI, DeepSeek, Z.AI,</text>
    <text x="905" y="224" fill="#a7b0c2" font-size="16">local and custom OpenAI-compatible APIs</text>
    <rect x="905" y="256" width="170" height="42" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="928" y="283" fill="#f8fafc" font-size="15" font-weight="700">cost tracking</text>
    <rect x="1095" y="256" width="170" height="42" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="1118" y="283" fill="#f8fafc" font-size="15" font-weight="700">context limits</text>

    <rect x="865" y="390" width="455" height="230" rx="22" fill="#111827" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="905" y="446" fill="#22d3ee" font-size="28" font-weight="800">Local ML models</text>
    <text x="905" y="480" fill="#a7b0c2" font-size="16">BGE-M3 embeddings, BGE reranker,</text>
    <text x="905" y="504" fill="#a7b0c2" font-size="16">GLiNER entities, mREBEL relations,</text>
    <text x="905" y="528" fill="#a7b0c2" font-size="16">CLIP image search, Marker PDF parsing</text>
    <rect x="905" y="560" width="170" height="42" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="928" y="587" fill="#f8fafc" font-size="15" font-weight="700">GPU worker</text>
    <rect x="1095" y="560" width="170" height="42" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="1118" y="587" fill="#f8fafc" font-size="15" font-weight="700">subprocesses</text>
  </g>

  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355 360H455" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
    <path d="M765 240H865" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  </g>
  <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M765 506H865" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  </g>
</svg>
