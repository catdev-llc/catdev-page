<svg xmlns="http://www.w3.org/2000/svg" class="archify-diagram" viewBox="0 0 1360 667" role="img" aria-label="Model Roles In AXIOM — LLMs are selected by role; retrieval and document intelligence run through dedicated local models. (architecture diagram)">
        <style>
  .archify-diagram {
    --bg: #020617;
    --grid: #1e293b;
    --text: #ffffff;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --lane-fill: rgba(15, 23, 42, 0.22);
    --lane-stroke: #334155;
    --arrow: #64748b;
    --arrow-emphasis: #34d399;
    --mask: #0f172a;
    --frontend-fill: rgba(8, 51, 68, 0.4);
    --frontend-stroke: #22d3ee;
    --backend-fill: rgba(6, 78, 59, 0.4);
    --backend-stroke: #34d399;
    --database-fill: rgba(76, 29, 149, 0.4);
    --database-stroke: #a78bfa;
    --cloud-fill: rgba(120, 53, 15, 0.3);
    --cloud-stroke: #fbbf24;
    --security-fill: rgba(136, 19, 55, 0.4);
    --security-stroke: #fb7185;
    --messagebus-fill: rgba(251, 146, 60, 0.3);
    --messagebus-stroke: #fb923c;
    --external-fill: rgba(30, 41, 59, 0.5);
    --external-stroke: #94a3b8;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }
  .c-bg { fill: var(--bg); }
  .c-grid { stroke: var(--grid); fill: none; }
  .c-mask { fill: var(--mask); stroke: none; }
  .c-frontend { fill: var(--frontend-fill); stroke: var(--frontend-stroke); }
  .c-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
  .c-database { fill: var(--database-fill); stroke: var(--database-stroke); }
  .c-cloud { fill: var(--cloud-fill); stroke: var(--cloud-stroke); }
  .c-security { fill: var(--security-fill); stroke: var(--security-stroke); }
  .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
  .c-external { fill: var(--external-fill); stroke: var(--external-stroke); }
  .c-security-group { fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4, 4; }
  .c-region { fill: rgba(251, 191, 36, 0.05); stroke: var(--cloud-stroke); stroke-dasharray: 8, 4; }
  .c-lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6, 6; }
  .t-primary { fill: var(--text); }
  .t-muted { fill: var(--text-muted); }
  .t-dim { fill: var(--text-dim); }
  .t-frontend { fill: var(--frontend-stroke); }
  .t-backend { fill: var(--backend-stroke); }
  .t-database { fill: var(--database-stroke); }
  .t-cloud { fill: var(--cloud-stroke); }
  .t-security { fill: var(--security-stroke); }
  .t-messagebus { fill: var(--messagebus-stroke); }
  .t-external { fill: var(--external-stroke); }
  .a-default { stroke: var(--arrow); fill: none; }
  .a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
  .a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5, 5; }
  .a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4, 4; }
  .m-default { fill: var(--arrow); }
  .m-emphasis { fill: var(--arrow-emphasis); }
  .m-security { fill: var(--security-stroke); }
  .m-dashed { fill: var(--database-stroke); }
</style>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
        <!-- Background Grid -->
        <rect width="100%" height="100%" class="c-bg"/>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect x="90" y="270" width="265" height="329" rx="12" class="c-region" stroke-width="1"/>
        <text x="98" y="288" class="t-cloud" font-size="9" font-weight="600">LLM slots — configured per user</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 325 327 L 382 327 Q 390 327 390 335 L 390 352 Q 390 360 398 360 L 455 360" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 735 360 L 792 360 Q 800 360 800 352 L 800 198 Q 800 190 808 190 L 865 190" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 735 360 L 792 360 Q 800 360 800 368 L 800 477 Q 800 485 808 485 L 865 485" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <rect x="120" y="300" width="205" height="54" rx="6" class="c-mask"/>
        <rect x="120" y="300" width="205" height="54" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="222.5" y="331" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Fast</text>

        <rect x="120" y="375" width="205" height="54" rx="6" class="c-mask"/>
        <rect x="120" y="375" width="205" height="54" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="222.5" y="406" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Mid</text>

        <rect x="120" y="450" width="205" height="54" rx="6" class="c-mask"/>
        <rect x="120" y="450" width="205" height="54" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="222.5" y="481" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Intelligent</text>

        <rect x="120" y="525" width="205" height="54" rx="6" class="c-mask"/>
        <rect x="120" y="525" width="205" height="54" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="222.5" y="556" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Verifier</text>

        <rect x="455" y="210" width="280" height="300" rx="6" class="c-mask"/>
        <rect x="455" y="210" width="280" height="300" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="595" y="358" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Agent work</text>
        <text x="595" y="374" class="t-muted" font-size="9" text-anchor="middle">different jobs need different models</text>

        <rect x="865" y="130" width="455" height="120" rx="6" class="c-mask"/>
        <rect x="865" y="130" width="455" height="120" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="1092.5" y="188" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Provider layer</text>
        <text x="1092.5" y="204" class="t-muted" font-size="9" text-anchor="middle">OpenRouter · OpenAI · DeepSeek · Z.AI · local</text>
        <text x="1092.5" y="242" class="t-external" font-size="7" text-anchor="middle">OpenAI-compatible</text>

        <rect x="865" y="410" width="455" height="150" rx="6" class="c-mask"/>
        <rect x="865" y="410" width="455" height="150" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="1092.5" y="483" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Local ML models</text>
        <text x="1092.5" y="499" class="t-muted" font-size="9" text-anchor="middle">BGE-M3 · reranker · GLiNER · mREBEL · CLIP · Marker</text>
        <text x="1092.5" y="552" class="t-database" font-size="7" text-anchor="middle">GPU worker · subprocesses</text>

        <!-- Connection labels -->

        <rect x="783" y="255" width="34" height="14" rx="3" class="c-mask"/>
        <text x="800" y="265" class="t-backend" font-size="8" text-anchor="middle">calls</text>
        <rect x="773.4" y="402.5" width="53.199999999999996" height="14" rx="3" class="c-mask"/>
        <text x="800" y="412.5" class="t-muted" font-size="8" text-anchor="middle">retrieval</text>

        <!-- Legend -->
        <text x="40" y="638" class="t-primary" font-size="9" font-weight="600">Legend</text>
        <rect x="40" y="643" width="14" height="9" rx="2" class="c-external" stroke-width="1"/>
        <text x="60" y="651" class="t-muted" font-size="8">External</text>
        <rect x="138" y="643" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="158" y="651" class="t-muted" font-size="8">Backend</text>
        <rect x="231" y="643" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="251" y="651" class="t-muted" font-size="8">Database</text>
      </svg>
